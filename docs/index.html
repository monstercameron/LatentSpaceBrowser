    <title>LatentSpace</title>
    <script>
      // Apply the saved theme and text size before first paint so the page never flashes.
      try {
        var saved = localStorage.getItem('latent_browser_dark_mode');
        var dark = saved ? saved === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        var size = localStorage.getItem('latent_text_size');
        if (size) document.documentElement.dataset.text = size;
      } catch (e) {}
    </script>
